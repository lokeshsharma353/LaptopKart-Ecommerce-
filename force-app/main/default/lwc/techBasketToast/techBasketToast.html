<template>
    <div class="tb-toast-stack">
        <template for:each={toasts} for:item="toast">
            <div key={toast.id} class={toast.className}>
                <span class="tb-toast-icon">{toast.icon}</span>
                <span class="tb-toast-msg">{toast.message}</span>
                <button class="tb-toast-close" data-id={toast.id} onclick={handleClose}>&#10005;</button>
                <div class="tb-toast-bar"></div>
            </div>
        </template>
    </div>
</template>
